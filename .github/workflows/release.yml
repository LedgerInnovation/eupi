name: Release

# Publishes @eupi/qr to npm when a GitHub Release is published.
#
# Uses npm trusted publishing (OIDC): configure the GitHub Actions trusted
# publisher on npmjs.com for the package (repository LedgerInnovation/eupi,
# workflow release.yml) and no npm token secret is needed; provenance
# attestations are generated automatically. The very first publish of a new
# package must be done manually from a maintainer machine.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      - run: npm publish --access public
        working-directory: packages/qr
